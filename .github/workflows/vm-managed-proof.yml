name: VM managed Android proof with verified native build
on:
  workflow_dispatch:
    inputs:
      native_run_id:
        description: 'Completed vm-engine.yml run with both native ABI builds successful'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  android-managed-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require verified source identity and unchanged native compiler inputs
        env:
          GH_TOKEN: ${{ github.token }}
          NATIVE_RUN_ID: ${{ inputs.native_run_id }}
        run: |
          python3 -m unittest discover -s scripts/vm -p 'test_native_provenance.py'
          python3 scripts/vm/verify-native-provenance.py --repository "$GITHUB_REPOSITORY" --run-id "$NATIVE_RUN_ID" --evidence dist/vm-android-proof/native-provenance.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vm-runtime-x86_64
          path: dist/vm-engine/x86_64
          run-id: ${{ inputs.native_run_id }}
          github-token: ${{ github.token }}
      - name: Select the existing Java17 and Android SDK
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Generate verified Android instrumentation assets
        run: |
          python3 scripts/vm/build-fixture.py --output dist/vm-fixture
          python3 scripts/vm/build-network-fixture.py --output dist/vm-network-fixture
          python3 scripts/vm/build-https-fixture.py --output dist/vm-https-fixture
      - name: Verify wrapper and proof guards
        run: |
          echo '0336f591bc0ec9aa0c9988929b93ecc916b3c1d52aed202c7381db144aa0ef15  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          ./gradlew --version --no-daemon
          python3 -m unittest discover -s scripts/vm -p 'test_android_proof.py'
          python3 -m unittest discover -s scripts/vm -p 'test_proof_apk.py'
          python3 -m unittest discover -s scripts/vm -p 'test_native_build.py'
      - name: Build and verify the exact APK proof assets and JNI before boot
        run: |
          ./gradlew :vm-engine:assembleDebugAndroidTest -PvmNativeDir=dist/vm-engine --no-daemon
          python3 scripts/vm/verify-proof-apk.py --apk vm-engine/build/outputs/apk/androidTest/debug/vm-engine-debug-androidTest.apk --fixture dist/vm-fixture --network-fixture dist/vm-network-fixture --https-fixture dist/vm-https-fixture --native dist/vm-engine --abi x86_64 --evidence dist/vm-android-proof/apk-evidence.json
      - name: Enable KVM for the Android emulator on the CI host
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-linex-ci-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Boot Linux inside the managed Android process twice
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/vm/run-android-proof.sh
      - name: Preserve source provenance, device proof and test failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vm-android-managed-evidence
          path: |
            dist/vm-android-proof
            dist/vm-engine/x86_64/elf-evidence.json
            vm-engine/build/reports/androidTests
            vm-engine/build/outputs/androidTest-results
            vm-engine/build/reports/tests
          if-no-files-found: error
          retention-days: 14
