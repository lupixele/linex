name: Debian desktop with audited Ubuntu kernel update
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  desktop-provision:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require the accepted immutable factory producer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m unittest discover -s scripts/vm -p 'test_kernel_refresh.py'
          python3 - <<'PY'
          import importlib.util, json, subprocess
          spec = importlib.util.spec_from_file_location('guard', 'scripts/vm/verify-app-desktop-apk.py')
          guard = importlib.util.module_from_spec(spec); spec.loader.exec_module(guard)
          data = json.loads(subprocess.check_output(['gh', 'api', 'repos/lupixele/linex/actions/runs/37653179199']))
          guard.validate_producer(data, 37653179199, 'b6d3b785e2ba367476e15e0deeb4f9b7efd67385')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: vm-desktop-factory-candidate
          path: dist/vm-desktop-base
          run-id: 37653179199
          github-token: ${{ github.token }}
      - name: Install actual host proof tools
        run: sudo apt-get update && sudo apt-get install --yes qemu-system-arm e2fsprogs python3-pycryptodome
      - name: Refresh pinned kernel packages and verify unchanged raw factory bytes
        run: sudo python3 scripts/vm/refresh-desktop-kernel.py --candidate dist/vm-desktop-base --output dist/vm-desktop-refreshed
      - name: Prove real updated-kernel boot, display, input, HTTPS, Firefox and clean filesystem
        run: sudo /usr/bin/python3 scripts/vm/test-desktop-image.py --image dist/vm-desktop-refreshed --evidence dist/vm-desktop-host-proof --timeout 300
      - name: Preserve evidence for successful or failed acceptance
        if: always()
        run: |
          mkdir -p dist/vm-desktop-evidence
          cp dist/vm-desktop-base/desktop-image-lock.json dist/vm-desktop-evidence/
          if test -d dist/vm-desktop-host-proof; then sudo cp -a dist/vm-desktop-host-proof dist/vm-desktop-evidence/; fi
          if test -f dist/vm-desktop-refreshed/kernel-evidence.json; then sudo cp dist/vm-desktop-refreshed/kernel-evidence.json dist/vm-desktop-evidence/; fi
          sudo chown -R "$(id -u):$(id -g)" dist/vm-desktop-evidence
      - name: Expose immutable factory assets
        if: success()
        run: |
          mkdir -p dist/vm-desktop-artifact
          sudo cp -- dist/vm-desktop-refreshed/{kernel,kernel.config,kernel-evidence.json,desktop.cpio.gz,factory.raw.xz,manifest.json,desktop-image-lock.json} dist/vm-desktop-artifact/
          sudo chown -R "$(id -u):$(id -g)" dist/vm-desktop-artifact
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: vm-desktop-provision-evidence
          path: dist/vm-desktop-evidence
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: success()
        with:
          name: vm-desktop-factory-candidate
          path: dist/vm-desktop-artifact
          if-no-files-found: error
          retention-days: 14
